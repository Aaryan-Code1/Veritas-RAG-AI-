[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-ai-rag"
version = "1.0.0"
description = "Enterprise Retrieval-Augmented Generation (RAG) System with Strict Citations and Evaluation Framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "VeritasAI Core Engineering Team"}
]
keywords = ["rag", "llm", "citations", "qdrant", "evaluations", "enterprise-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio_mode=auto"
testpaths = [
    "tests"
]
