version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: veritas_qdrant
    restart: always
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true

  redis:
    image: redis:7.2-alpine
    container_name: veritas_redis
    restart: always
    ports:
      - "6379:6379"

  veritas_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas_api
    restart: on-failure
    depends_on:
      - qdrant
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

volumes:
  qdrant_storage:
